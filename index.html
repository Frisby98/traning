<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nick Training">
<meta name="theme-color" content="#0f0f0f">
<title>Nick's Training</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;--bg4:#2e2e2e;--acc:#c5f135;--acc2:#9dc210;--text:#f0f0f0;--text2:#999;--text3:#555;--border:#2a2a2a;--border2:#3a3a3a;--r:12px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.on{display:flex}

/* ── SHARED ── */
.topbar{background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px 12px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar h2{font-size:17px;font-weight:600}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 90px}
.bottom-nav{position:absolute;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0);z-index:20}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text3);font-size:10px;font-family:'DM Sans',sans-serif;cursor:pointer;padding:8px 0;touch-action:manipulation}
.nav-btn.on{color:var(--acc)}
.nav-ico{font-size:20px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.card-pad{padding:14px}
.btn-acc{background:var(--acc);color:#000;border:none;border-radius:var(--rs);padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;touch-action:manipulation}
.btn-acc:active{background:var(--acc2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 14px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;touch-action:manipulation}
.btn-ghost:active{background:var(--bg3)}
.btn-danger{background:transparent;color:#ff5555;border:1px solid #552222;border-radius:var(--rs);padding:8px 14px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;touch-action:manipulation}
.inp{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:10px 12px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;outline:none}
.inp:focus{border-color:var(--acc)}
.inp-sm{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 10px;color:var(--text);font-size:14px;font-family:'DM Mono',monospace;outline:none;text-align:center}
.inp-sm:focus{border-color:var(--acc)}
.lbl{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:6px}
.tag{display:inline-block;font-size:10px;border-radius:4px;padding:2px 7px;font-weight:500}
.tag-green{background:#1a2a00;color:var(--acc)}
.tag-blue{background:#001a2a;color:#5bc4f5}
.empty{text-align:center;color:var(--text3);font-size:14px;padding:40px 16px;line-height:1.8}
.row{display:flex;align-items:center;gap:8px}
.flex1{flex:1}

/* ── START SCREEN ── */
.start-hero{padding:40px 24px 20px;text-align:center}
.start-hero h1{font-size:26px;font-weight:600;letter-spacing:-1px;margin-bottom:4px}
.start-hero h1 span{color:var(--acc)}
.start-hero p{font-size:13px;color:var(--text2)}
.form-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.day-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.day-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:9px 4px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;touch-action:manipulation;text-align:center}
.day-btn.on{background:var(--acc);color:#000;border-color:var(--acc)}
.prog-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.prog-sel-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:13px 14px;font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;touch-action:manipulation;text-align:left}
.prog-sel-btn.on{background:#1a2a00;color:var(--acc);border-color:var(--acc)}
.start-go{width:100%;background:var(--acc);color:#000;border:none;border-radius:var(--r);padding:15px;font-size:16px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;touch-action:manipulation;margin-top:6px}
.start-go:disabled{background:var(--bg3);color:var(--text3)}

/* ── WORKOUT ── */
.sess-bar{padding:12px 16px 10px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.sess-top{display:flex;align-items:center;justify-content:space-between}
.sess-info-txt{font-size:15px;font-weight:600}
.sess-info-txt span{color:var(--acc)}
.sess-sub{font-size:11px;color:var(--text3);margin-top:2px}
.week-ctl{display:flex;align-items:center;border:1px solid var(--border2);border-radius:var(--rs);overflow:hidden}
.wbtn{background:var(--bg3);border:none;color:var(--text);width:30px;height:30px;font-size:16px;cursor:pointer;touch-action:manipulation}
.wlabel{font-size:12px;font-weight:500;color:var(--acc);padding:0 8px;height:30px;display:flex;align-items:center;border-left:1px solid var(--border2);border-right:1px solid var(--border2);min-width:44px;justify-content:center;font-family:'DM Mono',monospace}

/* exercise cards in workout */
.ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.ex-head{display:flex;gap:10px;padding:12px;align-items:flex-start;cursor:pointer}
.ex-thumb{width:48px;height:48px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg3);flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text3)}
.ex-thumb img{width:100%;height:100%;object-fit:cover}
.ex-thumb input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:500;color:var(--text);line-height:1.3}
.ex-sub{font-size:11px;color:var(--text3);margin-top:2px}
.chev{font-size:13px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.chev.open{transform:rotate(180deg)}
.ex-body{border-top:1px solid var(--border)}
.params-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px}
.param-cell{background:var(--bg3);border-radius:var(--rs);padding:7px 8px}
.plabel{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.pinput{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;font-weight:500;outline:none;font-family:'DM Mono',monospace}
.pinput:focus{color:var(--acc)}
.pause-bar{margin:0 10px 10px;background:#1a1200;border:1px solid #3a2800;border-radius:var(--rs);padding:8px 12px;font-size:12px;color:#c8a020;display:flex;align-items:center;gap:6px}
.weight-row{display:flex;align-items:center;gap:8px;padding:0 10px 10px}
.wfield{flex:1;display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 10px}
.wfield:focus-within{border-color:var(--acc)}
.winput{flex:1;background:transparent;border:none;color:var(--text);font-size:15px;font-weight:500;outline:none;font-family:'DM Mono',monospace}
.wunit{font-size:11px;color:var(--text3)}
.savebtn{background:var(--acc);color:#000;border:none;border-radius:var(--rs);padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation;font-family:'DM Sans',sans-serif}
.savebtn.ok{background:var(--bg3);color:#4caf50;border:1px solid #4caf50}
.hist-toggle{width:100%;background:none;border:none;color:var(--text3);font-size:11px;padding:5px 10px;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif;touch-action:manipulation}
.hist-row{display:flex;justify-content:space-between;padding:5px 10px;border-top:1px solid var(--border);font-size:12px}
.hist-wk{color:var(--text3)}
.hist-val{font-family:'DM Mono',monospace;color:var(--acc);font-weight:500}
.note-area{padding:0 10px 10px}
.note-add{width:100%;background:none;border:1px dashed var(--border2);border-radius:var(--rs);color:var(--text3);font-size:12px;padding:7px 10px;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif}
.note-ta{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 10px;resize:none;outline:none;line-height:1.5}
.note-ta:focus{border-color:var(--acc)}
.note-display{font-size:12px;color:var(--text2);font-style:italic;padding:7px 10px;background:var(--bg3);border-radius:var(--rs);border-left:2px solid var(--acc2);cursor:pointer}
.ss-divider{display:flex;align-items:center;gap:8px;padding:4px 10px}
.ss-line{flex:1;height:1px;background:var(--border2)}
.ss-label{font-size:10px;color:var(--text3);white-space:nowrap}

/* ── SETTINGS ── */
.settings-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.stab{flex:1;padding:12px;font-size:13px;font-weight:500;background:none;border:none;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;border-bottom:2px solid transparent;touch-action:manipulation}
.stab.on{color:var(--acc);border-bottom-color:var(--acc)}
.stab-content{display:none}
.stab-content.on{display:block}

/* exercise archive card */
.arch-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;display:flex;align-items:center;gap:10px;padding:10px 12px}
.arch-thumb{width:40px;height:40px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text3)}
.arch-thumb img{width:100%;height:100%;object-fit:cover}
.arch-name{flex:1;font-size:14px;font-weight:500}
.arch-note{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* program builder */
.prog-tab-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.prog-tab-row::-webkit-scrollbar{display:none}
.ptab{flex-shrink:0;padding:6px 14px;border-radius:99px;border:1px solid var(--border2);font-size:12px;font-weight:500;cursor:pointer;background:transparent;color:var(--text2);touch-action:manipulation}
.ptab.on{background:var(--acc);color:#000;border-color:var(--acc)}
.block-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.block-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.block-type{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:500}
.block-type.single{background:#001a2a;color:#5bc4f5}
.block-type.ss{background:#1a0a2a;color:#c084fc}
.block-title{flex:1;font-size:13px;font-weight:500}
.block-ex{padding:8px 12px;border-bottom:1px solid var(--border)}
.block-ex:last-of-type{border-bottom:none}
.block-ex-name{font-size:13px;font-weight:500;margin-bottom:6px}
.block-params{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bparam{background:var(--bg3);border-radius:6px;padding:6px 8px}
.bparam-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.bparam-inp{width:100%;background:transparent;border:none;color:var(--text);font-size:13px;font-weight:500;outline:none;font-family:'DM Mono',monospace;text-align:center}
.bparam-inp:focus{color:var(--acc)}
.pause-inp-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0a0800;border-top:1px solid #2a1a00}
.pause-inp-row label{font-size:11px;color:#c8a020;flex:1}
.pause-inp{width:80px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:5px 8px;color:var(--text);font-size:13px;font-family:'DM Mono',monospace;outline:none;text-align:center}
.pause-inp:focus{border-color:var(--acc)}

/* modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.on{display:flex}
.modal{background:var(--bg2);border-radius:var(--r) var(--r) 0 0;width:100%;max-height:85vh;display:flex;flex-direction:column;padding:0}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-head h3{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.modal-body{flex:1;overflow-y:auto;padding:16px}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}
.ex-pick-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.ex-pick-item:last-child{border-bottom:none}
.ex-pick-item:active{opacity:.7}
.ex-pick-thumb{width:36px;height:36px;border-radius:6px;background:var(--bg3);border:1px solid var(--border2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text3);flex-shrink:0}
.ex-pick-thumb img{width:100%;height:100%;object-fit:cover}
.ex-pick-name{font-size:14px;font-weight:500;flex:1}
.ex-pick-check{font-size:18px;color:var(--acc);flex-shrink:0}

/* diary */
.diary-entry{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;cursor:pointer}
.diary-entry:active{background:var(--bg3)}
.diary-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.diary-date{font-size:13px;font-weight:600}
.diary-day{font-size:11px;color:var(--text3)}
.diary-week{font-size:11px;color:var(--text3);margin-top:3px}

/* stats */
.bars{display:flex;align-items:flex-end;gap:3px;height:56px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end}
.bar{width:100%;background:var(--acc);border-radius:2px 2px 0 0;min-height:2px}
.bar.empty{background:var(--bg4)}
.bar-lbl{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace}
.bar-val{font-size:8px;color:var(--text2);font-family:'DM Mono',monospace}
</style>
</head>
<body>
<div id="app">

<!-- ══════════════════════════════════════
     START SCREEN
══════════════════════════════════════ -->
<div id="scr-start" class="screen on">
  <div style="flex:1;overflow-y:auto;padding-bottom:20px">
    <div class="start-hero">
      <h1>Nick's <span>Training</span></h1>
      <p>Buon allenamento 💪</p>
    </div>
    <div style="padding:0 16px">
      <div class="form-block">
        <div class="lbl">Data</div>
        <input class="inp" type="date" id="sel-date">
      </div>
      <div class="form-block">
        <div class="lbl">Giorno</div>
        <div class="day-grid" id="day-grid"></div>
      </div>
      <div class="form-block">
        <div class="lbl">Programma</div>
        <div class="prog-list" id="prog-list"></div>
      </div>
      <button class="start-go" id="start-go" onclick="startWorkout()" disabled>Inizia allenamento →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     WORKOUT SCREEN
══════════════════════════════════════ -->
<div id="scr-workout" class="screen" style="position:relative">
  <div class="sess-bar">
    <div class="sess-top">
      <div>
        <div class="sess-info-txt" id="sess-prog-lbl">—</div>
        <div class="sess-sub" id="sess-date-lbl">—</div>
      </div>
      <div class="week-ctl">
        <button class="wbtn" onclick="chWk(-1)">‹</button>
        <div class="wlabel" id="wlbl">W1</div>
        <button class="wbtn" onclick="chWk(1)">›</button>
      </div>
    </div>
  </div>
  <div class="scroll" id="ex-list"></div>
  <div class="bottom-nav">
    <button class="nav-btn on" id="nb-wo" onclick="goTab('workout')"><div class="nav-ico">🏋️</div>Allenamento</button>
    <button class="nav-btn" id="nb-di" onclick="goTab('diary')"><div class="nav-ico">📅</div>Diario</button>
    <button class="nav-btn" id="nb-st" onclick="goTab('stats')"><div class="nav-ico">📈</div>Progressi</button>
    <button class="nav-btn" id="nb-se" onclick="goTab('settings')"><div class="nav-ico">⚙️</div>Impostazioni</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     DIARY SCREEN
══════════════════════════════════════ -->
<div id="scr-diary" class="screen" style="position:relative">
  <div class="topbar">
    <h2>📅 Diario</h2>
    <button class="btn-acc" onclick="newSession()" style="padding:8px 14px;font-size:13px">+ Nuovo</button>
  </div>
  <div class="scroll" id="diary-list"></div>
  <div class="bottom-nav">
    <button class="nav-btn" onclick="goTab('workout')"><div class="nav-ico">🏋️</div>Allenamento</button>
    <button class="nav-btn on" onclick="goTab('diary')"><div class="nav-ico">📅</div>Diario</button>
    <button class="nav-btn" onclick="goTab('stats')"><div class="nav-ico">📈</div>Progressi</button>
    <button class="nav-btn" onclick="goTab('settings')"><div class="nav-ico">⚙️</div>Impostazioni</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     STATS SCREEN
══════════════════════════════════════ -->
<div id="scr-stats" class="screen" style="position:relative">
  <div class="topbar"><h2>📈 Progressi</h2></div>
  <div class="scroll" id="stats-list"></div>
  <div class="bottom-nav">
    <button class="nav-btn" onclick="goTab('workout')"><div class="nav-ico">🏋️</div>Allenamento</button>
    <button class="nav-btn" onclick="goTab('diary')"><div class="nav-ico">📅</div>Diario</button>
    <button class="nav-btn on" onclick="goTab('stats')"><div class="nav-ico">📈</div>Progressi</button>
    <button class="nav-btn" onclick="goTab('settings')"><div class="nav-ico">⚙️</div>Impostazioni</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     SETTINGS SCREEN
══════════════════════════════════════ -->
<div id="scr-settings" class="screen" style="position:relative">
  <div class="topbar"><h2>⚙️ Impostazioni</h2></div>
  <div class="settings-tabs">
    <button class="stab on" id="stab-arch" onclick="selStab('arch')">Esercizi</button>
    <button class="stab" id="stab-prog" onclick="selStab('prog')">Programmi</button>
    <button class="stab" id="stab-pname" onclick="selStab('pname')">Nomi prog.</button>
  </div>
  <div class="scroll">

    <!-- ARCHIVE TAB -->
    <div class="stab-content on" id="sc-arch">
      <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
        <button class="btn-acc" onclick="openAddEx()">+ Esercizio</button>
      </div>
      <div id="arch-list"></div>
    </div>

    <!-- PROGRAMS TAB -->
    <div class="stab-content" id="sc-prog">
      <div class="prog-tab-row" id="prog-tabs"></div>
      <div id="prog-builder"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
        <button class="btn-ghost" onclick="addSingleBlock()">+ Esercizio singolo</button>
        <button class="btn-ghost" onclick="addSSBlock()">+ Superserie</button>
      </div>
    </div>

    <!-- PROG NAMES TAB -->
    <div class="stab-content" id="sc-pname">
      <div id="pname-list"></div>
    </div>

  </div>
  <div class="bottom-nav">
    <button class="nav-btn" onclick="goTab('workout')"><div class="nav-ico">🏋️</div>Allenamento</button>
    <button class="nav-btn" onclick="goTab('diary')"><div class="nav-ico">📅</div>Diario</button>
    <button class="nav-btn" onclick="goTab('stats')"><div class="nav-ico">📈</div>Progressi</button>
    <button class="nav-btn on" onclick="goTab('settings')"><div class="nav-ico">⚙️</div>Impostazioni</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     MODAL: ADD/EDIT EXERCISE
══════════════════════════════════════ -->
<div class="modal-overlay" id="modal-ex">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-ex-title">Nuovo esercizio</h3>
      <button class="modal-close" onclick="closeModal('modal-ex')">✕</button>
    </div>
    <div class="modal-body">
      <div style="margin-bottom:14px">
        <div class="lbl">Nome</div>
        <input class="inp" id="ex-name-inp" type="text" placeholder="Es. Bench Press">
      </div>
      <div style="margin-bottom:14px">
        <div class="lbl">Foto</div>
        <div style="display:flex;align-items:center;gap:10px">
          <div id="ex-photo-prev" style="width:56px;height:56px;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;position:relative;flex-shrink:0">
            📷<input type="file" accept="image/*" onchange="prevExPhoto(event)" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
          </div>
          <span style="font-size:12px;color:var(--text3)">Tocca per aggiungere</span>
        </div>
      </div>
      <div>
        <div class="lbl">Note coach / tecnica</div>
        <textarea class="inp" id="ex-note-inp" rows="3" placeholder="Descrizione, note tecniche..." style="resize:none;line-height:1.5"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-acc" style="width:100%" onclick="saveExercise()">Salva esercizio</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MODAL: PICK EXERCISE
══════════════════════════════════════ -->
<div class="modal-overlay" id="modal-pick">
  <div class="modal">
    <div class="modal-head">
      <h3>Scegli esercizio</h3>
      <button class="modal-close" onclick="closeModal('modal-pick')">✕</button>
    </div>
    <div class="modal-body" id="pick-list"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let S={};
// S.exercises = [{id,name,note,photo}]
// S.progNames = ['Total Body','Upper Body','Lower Body']
// S.programs = { 'pid': [{type:'single'|'ss', pause:'', exs:[{eid,sets,reps,rpe}]}] }
// S.sessions = [{id,date,day,progId,week}]
// S.weights = { 'eid|week': val }
// S.userNotes = { 'eid': val }
// S.photos = { 'eid': base64 }
// S.expanded = {}
// S.currentWeek = 0

let currentProg=null; // prog id in settings
let currentProgIdWorkout=null;
let week=0;
let selDay=null,selProgId=null;
let editExId=null;
let pendingPhotoData=null;
let pickCallback=null;
let settingsTab='arch';
let currentTab='workout';
let expanded={};

function loadS(){try{const r=localStorage.getItem('nickgym_v4');if(r)S=JSON.parse(r);}catch(e){}
  if(!S.exercises)S.exercises=[];
  if(!S.progNames)S.progNames=['Total Body','Upper Body','Lower Body'];
  if(!S.programs){S.programs={};S.progNames.forEach((_,i)=>S.programs[i]=[]);}
  if(!S.sessions)S.sessions=[];
  if(!S.weights)S.weights={};
  if(!S.userNotes)S.userNotes={};
  if(!S.photos)S.photos={};
  if(!S.currentWeek)S.currentWeek=0;
}
function saveS(){try{localStorage.setItem('nickgym_v4',JSON.stringify(S));}catch(e){}}

/* ═══════════════════════════════════════
   SCREENS / TABS
═══════════════════════════════════════ */
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}

function goTab(t){
  currentTab=t;
  if(t==='workout'){showScreen('scr-workout');renderWorkout();}
  else if(t==='diary'){showScreen('scr-diary');renderDiary();}
  else if(t==='stats'){showScreen('scr-stats');renderStats();}
  else if(t==='settings'){showScreen('scr-settings');renderSettings();}
}

function newSession(){selProgId=null;initStart();showScreen('scr-start');}

/* ═══════════════════════════════════════
   START SCREEN
═══════════════════════════════════════ */
const DAYS=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];

function initStart(){
  const today=new Date();
  const yyyy=today.getFullYear(),mm=String(today.getMonth()+1).padStart(2,'0'),dd=String(today.getDate()).padStart(2,'0');
  document.getElementById('sel-date').value=`${yyyy}-${mm}-${dd}`;
  const todayDay=[6,0,1,2,3,4,5][today.getDay()];
  if(!selDay)selDay=DAYS[todayDay];
  document.getElementById('day-grid').innerHTML=DAYS.map(d=>`<button class="day-btn${d===selDay?' on':''}" onclick="selDayFn('${d}')">${d.substring(0,3)}</button>`).join('');
  document.getElementById('prog-list').innerHTML=S.progNames.map((n,i)=>`<button class="prog-sel-btn${i===selProgId?' on':''}" onclick="selProgFn(${i})">${n}</button>`).join('');
  checkGo();
}
function selDayFn(d){selDay=d;document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('on',b.textContent===d.substring(0,3)));checkGo();}
function selProgFn(i){selProgId=i;document.querySelectorAll('.prog-sel-btn').forEach((b,j)=>b.classList.toggle('on',j===i));checkGo();}
function checkGo(){document.getElementById('start-go').disabled=!(selDay&&selProgId!==null);}

function startWorkout(){
  const date=document.getElementById('sel-date').value;
  currentProgIdWorkout=selProgId;
  week=S.currentWeek||0;
  const sid='s'+Date.now();
  S.sessions.unshift({id:sid,date,day:selDay,progId:selProgId,week});
  saveS();
  const[y,m,d]=date.split('-');
  document.getElementById('sess-prog-lbl').innerHTML=`<span style="color:var(--acc)">${S.progNames[selProgId]}</span>`;
  document.getElementById('sess-date-lbl').textContent=`${selDay} ${d}/${m}/${y}`;
  document.getElementById('wlbl').textContent='W'+(week+1);
  showScreen('scr-workout');
  currentTab='workout';
  renderWorkout();
}

/* ═══════════════════════════════════════
   WORKOUT
═══════════════════════════════════════ */
function chWk(d){
  week=Math.max(0,week+d);
  S.currentWeek=week;
  saveS();
  document.getElementById('wlbl').textContent='W'+(week+1);
  renderWorkout();
}

function renderWorkout(){
  const blocks=S.programs[currentProgIdWorkout]||[];
  if(!blocks.length){document.getElementById('ex-list').innerHTML=`<div class="empty">Nessun esercizio nel programma.<br>Vai in <b>Impostazioni → Programmi</b><br>per costruire il tuo allenamento.</div>`;return;}
  let h='';
  blocks.forEach((block,bi)=>{
    if(block.type==='single'){
      h+=renderExCard(block.exs[0],bi,false,block.pause,'');
    } else {
      // superserie
      block.exs.forEach((ex,ei)=>{
        const isLast=ei===block.exs.length-1;
        h+=renderExCard(ex,bi,true,isLast?block.pause:'',ei===0?`Superserie ${String.fromCharCode(65+bi)}`:'');
        if(!isLast) h+=`<div class="ss-divider"><div class="ss-line"></div><div class="ss-label">+ superserie</div><div class="ss-line"></div></div>`;
      });
    }
  });
  document.getElementById('ex-list').innerHTML=h;
}

function renderExCard(exEntry,bi,isSS,pause,ssLabel){
  const ex=S.exercises.find(e=>e.id===exEntry.eid)||{id:exEntry.eid,name:'Esercizio eliminato',note:'',photo:''};
  const key=ex.id+'|'+week;
  const wt=S.weights[key]||'';
  const note=S.userNotes[ex.id]||'';
  const photo=S.photos[ex.id]||ex.photo||'';
  const open=expanded[bi+'_'+exEntry.eid]!==false;
  const showNote=S['snw_'+ex.id]==='1';
  const showHist=S['shh_'+ex.id]==='1';
  const sets=S['sets_'+ex.id+'_'+week]||exEntry.sets||'';
  const reps=S['reps_'+ex.id+'_'+week]||exEntry.reps||'';
  const rpe=S['rpe_'+ex.id+'_'+week]||exEntry.rpe||'';

  let histH='';
  if(showHist){
    let rows='';
    for(let wi=0;wi<=Math.max(week,7);wi++){const v=S.weights[ex.id+'|'+wi];if(v)rows+=`<div class="hist-row"><span class="hist-wk">W${wi+1}</span><span class="hist-val">${v} kg</span></div>`;}
    histH=`<button class="hist-toggle" onclick="togHist('${ex.id}')">▲ Nascondi storico</button>${rows||'<div style="padding:6px 10px;font-size:12px;color:var(--text3)">Nessun peso ancora.</div>'}`;
  } else {
    const hasAny=Object.keys(S.weights).some(k=>k.startsWith(ex.id+'|'));
    if(hasAny)histH=`<button class="hist-toggle" onclick="togHist('${ex.id}')">▼ Storico pesi</button>`;
  }

  let noteH='';
  if(showNote){noteH=`<div class="note-area"><textarea class="note-ta" rows="2" placeholder="Nota personale..." onblur="saveNote('${ex.id}',this.value)">${note}</textarea></div>`;}
  else if(note){noteH=`<div class="note-area"><div class="note-display" onclick="togNote('${ex.id}')">${note}</div></div>`;}
  else{noteH=`<div class="note-area"><button class="note-add" onclick="togNote('${ex.id}')">✏️ Nota personale</button></div>`;}

  const pauseBar=pause?`<div class="pause-bar">⏱ Pausa dopo superserie: <b>${pause}</b></div>`:'';

  return `<div class="ex-card">
    <div class="ex-head" onclick="togCard('${bi}_${exEntry.eid}')">
      <div class="ex-thumb" onclick="event.stopPropagation()">
        ${photo?`<img src="${photo}" alt="">`:'📷'}
        <input type="file" accept="image/*" onchange="handleWPhoto(event,'${ex.id}')">
      </div>
      <div class="ex-info">
        ${ssLabel?`<div class="tag tag-blue" style="margin-bottom:4px">${ssLabel}</div>`:''}
        <div class="ex-name">${ex.name}</div>
        ${ex.note?`<div class="ex-sub">${ex.note.substring(0,60)}${ex.note.length>60?'…':''}</div>`:''}
      </div>
      <div class="chev${open?' open':''}">▾</div>
    </div>
    ${open?`<div class="ex-body">
      <div class="params-grid">
        <div class="param-cell"><div class="plabel">Sets</div><input class="pinput" type="text" value="${sets}" onchange="savePar('sets','${ex.id}',this.value)" inputmode="text"></div>
        <div class="param-cell"><div class="plabel">Reps</div><input class="pinput" type="text" value="${reps}" onchange="savePar('reps','${ex.id}',this.value)" inputmode="text"></div>
        <div class="param-cell"><div class="plabel">RPE</div><input class="pinput" type="text" value="${rpe}" onchange="savePar('rpe','${ex.id}',this.value)" inputmode="decimal"></div>
      </div>
      <div class="weight-row">
        <div class="wfield">
          <span style="font-size:15px">⚖️</span>
          <input class="winput" type="number" step="0.5" inputmode="decimal" placeholder="—" value="${wt}" id="wi_${ex.id}">
          <span class="wunit">kg</span>
        </div>
        <button class="savebtn" id="sb_${ex.id}" onclick="saveW('${ex.id}')">Salva</button>
      </div>
      ${histH}
      ${noteH}
      ${pauseBar}
    </div>`:''}
  </div>`;
}

function togCard(k){expanded[k]=expanded[k]===false?true:false;renderWorkout();}
function togHist(id){S['shh_'+id]=S['shh_'+id]==='1'?'0':'1';saveS();renderWorkout();}
function togNote(id){S['snw_'+id]=S['snw_'+id]==='1'?'0':'1';saveS();renderWorkout();}
function saveNote(id,v){S.userNotes[id]=v;S['snw_'+id]='0';saveS();renderWorkout();}
function savePar(field,eid,val){S[field+'_'+eid+'_'+week]=val;saveS();}
function saveW(id){
  const inp=document.getElementById('wi_'+id);if(!inp)return;
  S.weights[id+'|'+week]=inp.value;saveS();
  const btn=document.getElementById('sb_'+id);
  if(btn){btn.textContent='✓';btn.className='savebtn ok';setTimeout(()=>{btn.textContent='Salva';btn.className='savebtn';},1400);}
}
function handleWPhoto(e,id){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{S.photos[id]=ev.target.result;saveS();renderWorkout();};r.readAsDataURL(f);
}

/* ═══════════════════════════════════════
   DIARY
═══════════════════════════════════════ */
function renderDiary(){
  if(!S.sessions.length){document.getElementById('diary-list').innerHTML=`<div class="empty">Nessun allenamento ancora.<br>Premi <b>+ Nuovo</b> per iniziare!</div>`;return;}
  document.getElementById('diary-list').innerHTML=S.sessions.map(s=>{
    const[y,m,d]=s.date.split('-');
    return `<div class="diary-entry" onclick="loadSession('${s.id}')">
      <div class="diary-top"><div class="diary-date">${d}/${m}/${y}</div><div class="tag tag-green">${S.progNames[s.progId]||'—'}</div></div>
      <div class="diary-day">${s.day}</div>
      <div class="diary-week">Settimana ${s.week+1}</div>
    </div>`;
  }).join('');
}
function loadSession(sid){
  const s=S.sessions.find(x=>x.id===sid);if(!s)return;
  currentProgIdWorkout=s.progId;week=s.week;
  const[y,m,d]=s.date.split('-');
  document.getElementById('sess-prog-lbl').innerHTML=`<span style="color:var(--acc)">${S.progNames[s.progId]}</span>`;
  document.getElementById('sess-date-lbl').textContent=`${s.day} ${d}/${m}/${y}`;
  document.getElementById('wlbl').textContent='W'+(week+1);
  goTab('workout');
}

/* ═══════════════════════════════════════
   STATS
═══════════════════════════════════════ */
function renderStats(){
  const exs=S.exercises;
  if(!exs.length){document.getElementById('stats-list').innerHTML=`<div class="empty">Aggiungi esercizi e inizia ad allenarti<br>per vedere i progressi qui.</div>`;return;}
  let h='';
  exs.forEach(ex=>{
    const keys=Object.keys(S.weights).filter(k=>k.startsWith(ex.id+'|'));
    if(!keys.length)return;
    const maxW=Math.max(...keys.map(k=>parseInt(k.split('|')[1])))+1;
    const ws=Array.from({length:Math.max(maxW,8)},(_,i)=>{const v=parseFloat(S.weights[ex.id+'|'+i]);return isNaN(v)?null:v;});
    const mx=Math.max(...ws.filter(Boolean));
    const display=ws.slice(-8);const si=ws.length-display.length;
    const bars=display.map((v,i)=>{const ht=v?Math.round((v/mx)*46):0;return `<div class="bar-wrap"><div class="bar-val">${v||''}</div><div class="bar${v?'':' empty'}" style="height:${Math.max(ht,2)}px"></div><div class="bar-lbl">W${si+i+1}</div></div>`;}).join('');
    h+=`<div class="card card-pad" style="margin-bottom:8px"><div class="ex-name" style="margin-bottom:8px">${ex.name}</div><div class="bars">${bars}</div></div>`;
  });
  document.getElementById('stats-list').innerHTML=h||`<div class="empty">Salva i pesi durante l'allenamento<br>e i progressi appariranno qui. 📈</div>`;
}

/* ═══════════════════════════════════════
   SETTINGS
═══════════════════════════════════════ */
function renderSettings(){
  renderArchive();
  renderProgBuilder();
  renderProgNames();
}
function selStab(t){
  settingsTab=t;
  ['arch','prog','pname'].forEach(x=>{
    document.getElementById('stab-'+x).classList.toggle('on',x===t);
    document.getElementById('sc-'+x).classList.toggle('on',x===t);
  });
}

/* — ARCHIVE — */
function renderArchive(){
  const list=S.exercises;
  if(!list.length){document.getElementById('arch-list').innerHTML=`<div class="empty">Nessun esercizio ancora.<br>Premi <b>+ Esercizio</b> per iniziare.</div>`;return;}
  document.getElementById('arch-list').innerHTML=list.map(ex=>{
    const photo=S.photos[ex.id]||ex.photo||'';
    return `<div class="arch-card">
      <div class="arch-thumb">${photo?`<img src="${photo}" alt="">`:ex.name[0].toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <div class="arch-name">${ex.name}</div>
        ${ex.note?`<div class="arch-note">${ex.note}</div>`:''}
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="btn-ghost" style="padding:6px 10px;font-size:12px" onclick="openEditEx('${ex.id}')">✏️</button>
        <button class="btn-danger" style="padding:6px 10px;font-size:12px" onclick="deleteEx('${ex.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function openAddEx(){editExId=null;pendingPhotoData=null;document.getElementById('modal-ex-title').textContent='Nuovo esercizio';document.getElementById('ex-name-inp').value='';document.getElementById('ex-note-inp').value='';const p=document.getElementById('ex-photo-prev');p.innerHTML='📷<input type="file" accept="image/*" onchange="prevExPhoto(event)" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">';openModal('modal-ex');}

function openEditEx(id){
  editExId=id;pendingPhotoData=null;
  const ex=S.exercises.find(e=>e.id===id);if(!ex)return;
  document.getElementById('modal-ex-title').textContent='Modifica esercizio';
  document.getElementById('ex-name-inp').value=ex.name;
  document.getElementById('ex-note-inp').value=ex.note||'';
  const photo=S.photos[id]||ex.photo||'';
  const p=document.getElementById('ex-photo-prev');
  p.innerHTML=`${photo?`<img src="${photo}" alt="" style="width:100%;height:100%;object-fit:cover">`:' 📷'}<input type="file" accept="image/*" onchange="prevExPhoto(event)" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">`;
  openModal('modal-ex');
}

function prevExPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{pendingPhotoData=ev.target.result;const p=document.getElementById('ex-photo-prev');p.innerHTML=`<img src="${pendingPhotoData}" style="width:100%;height:100%;object-fit:cover"><input type="file" accept="image/*" onchange="prevExPhoto(event)" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">`;};r.readAsDataURL(f);}

function saveExercise(){
  const name=document.getElementById('ex-name-inp').value.trim();
  if(!name)return alert('Inserisci un nome.');
  const note=document.getElementById('ex-note-inp').value.trim();
  if(editExId){
    const ex=S.exercises.find(e=>e.id===editExId);
    if(ex){ex.name=name;ex.note=note;}
    if(pendingPhotoData)S.photos[editExId]=pendingPhotoData;
  } else {
    const id='ex'+Date.now();
    S.exercises.push({id,name,note});
    if(pendingPhotoData)S.photos[id]=pendingPhotoData;
  }
  saveS();closeModal('modal-ex');renderArchive();
}

function deleteEx(id){
  if(!confirm('Eliminare questo esercizio?'))return;
  S.exercises=S.exercises.filter(e=>e.id!==id);
  saveS();renderArchive();
}

/* — PROGRAM BUILDER — */
function renderProgBuilder(){
  if(currentProg===null)currentProg=0;
  document.getElementById('prog-tabs').innerHTML=S.progNames.map((n,i)=>
    `<button class="ptab${i===currentProg?' on':''}" onclick="selProgTab(${i})">${n}</button>`
  ).join('');
  const blocks=S.programs[currentProg]||[];
  if(!blocks.length){document.getElementById('prog-builder').innerHTML=`<div class="empty" style="padding:20px 0">Nessun blocco ancora.<br>Aggiungi un esercizio singolo o una superserie.</div>`;return;}
  let h='';
  blocks.forEach((block,bi)=>{
    const typeLabel=block.type==='single'?'Singolo':'Superserie';
    const typeClass=block.type==='single'?'single':'ss';
    h+=`<div class="block-card">
      <div class="block-head">
        <span class="block-type ${typeClass}">${typeLabel}</span>
        <span class="block-title">${block.exs.map(e=>{const ex=S.exercises.find(x=>x.id===e.eid);return ex?ex.name:'?';}).join(' + ')}</span>
        <button class="btn-danger" style="padding:4px 8px;font-size:11px" onclick="deleteBlock(${bi})">✕</button>
      </div>`;
    block.exs.forEach((exEntry,ei)=>{
      const ex=S.exercises.find(x=>x.id===exEntry.eid)||{name:'Eliminato'};
      h+=`<div class="block-ex">
        <div class="block-ex-name">${ex.name}
          ${block.type==='ss'?`<button class="btn-danger" style="padding:2px 6px;font-size:10px;margin-left:6px" onclick="removeExFromBlock(${bi},${ei})">✕</button>`:''}
        </div>
        <div class="block-params">
          <div class="bparam"><div class="bparam-lbl">Sets</div><input class="bparam-inp" type="text" value="${exEntry.sets||''}" placeholder="3" onchange="updateBlockEx(${bi},${ei},'sets',this.value)"></div>
          <div class="bparam"><div class="bparam-lbl">Reps</div><input class="bparam-inp" type="text" value="${exEntry.reps||''}" placeholder="8-10" onchange="updateBlockEx(${bi},${ei},'reps',this.value)"></div>
          <div class="bparam"><div class="bparam-lbl">RPE</div><input class="bparam-inp" type="text" value="${exEntry.rpe||''}" placeholder="8" onchange="updateBlockEx(${bi},${ei},'rpe',this.value)"></div>
        </div>
      </div>`;
    });
    if(block.type==='ss'){
      h+=`<button class="btn-ghost" style="margin:8px 12px;font-size:12px;padding:6px 10px" onclick="addExToSS(${bi})">+ Aggiungi esercizio</button>`;
    }
    h+=`<div class="pause-inp-row">
      <label>⏱ Pausa dopo ${block.type==='ss'?'superserie':'esercizio'}</label>
      <input class="pause-inp" type="text" value="${block.pause||''}" placeholder="es. 90''" onchange="updateBlockPause(${bi},this.value)">
    </div></div>`;
  });
  document.getElementById('prog-builder').innerHTML=h;
}

function selProgTab(i){currentProg=i;renderProgBuilder();}

function addSingleBlock(){
  if(!S.exercises.length)return alert('Prima aggiungi almeno un esercizio nell\'archivio.');
  openPickModal(eid=>{
    if(!S.programs[currentProg])S.programs[currentProg]=[];
    S.programs[currentProg].push({type:'single',pause:'',exs:[{eid,sets:'',reps:'',rpe:''}]});
    saveS();renderProgBuilder();
  });
}

function addSSBlock(){
  if(!S.exercises.length)return alert('Prima aggiungi almeno un esercizio nell\'archivio.');
  openPickModal(eid=>{
    if(!S.programs[currentProg])S.programs[currentProg]=[];
    S.programs[currentProg].push({type:'ss',pause:'',exs:[{eid,sets:'',reps:'',rpe:''}]});
    saveS();renderProgBuilder();
  });
}

function addExToSS(bi){
  openPickModal(eid=>{
    S.programs[currentProg][bi].exs.push({eid,sets:'',reps:'',rpe:''});
    saveS();renderProgBuilder();
  });
}

function removeExFromBlock(bi,ei){
  const block=S.programs[currentProg][bi];
  block.exs.splice(ei,1);
  if(!block.exs.length)S.programs[currentProg].splice(bi,1);
  saveS();renderProgBuilder();
}

function deleteBlock(bi){S.programs[currentProg].splice(bi,1);saveS();renderProgBuilder();}
function updateBlockEx(bi,ei,field,val){S.programs[currentProg][bi].exs[ei][field]=val;saveS();}
function updateBlockPause(bi,val){S.programs[currentProg][bi].pause=val;saveS();}

/* — PROG NAMES — */
function renderProgNames(){
  document.getElementById('pname-list').innerHTML=S.progNames.map((n,i)=>`
    <div class="card card-pad" style="margin-bottom:8px">
      <div class="lbl">Programma ${i+1}</div>
      <input class="inp" type="text" value="${n}" onchange="updateProgName(${i},this.value)">
    </div>`).join('');
}
function updateProgName(i,val){S.progNames[i]=val;saveS();}

/* ═══════════════════════════════════════
   PICK MODAL
═══════════════════════════════════════ */
function openPickModal(cb){
  pickCallback=cb;
  const list=S.exercises;
  document.getElementById('pick-list').innerHTML=list.length?list.map(ex=>{
    const photo=S.photos[ex.id]||ex.photo||'';
    return `<div class="ex-pick-item" onclick="pickEx('${ex.id}')">
      <div class="ex-pick-thumb">${photo?`<img src="${photo}" alt="">`:ex.name[0].toUpperCase()}</div>
      <div class="ex-pick-name">${ex.name}</div>
      <div class="ex-pick-check">›</div>
    </div>`;
  }).join(''):`<div class="empty">Nessun esercizio nell'archivio.</div>`;
  openModal('modal-pick');
}
function pickEx(eid){closeModal('modal-pick');if(pickCallback)pickCallback(eid);pickCallback=null;}

/* ═══════════════════════════════════════
   MODALS
═══════════════════════════════════════ */
function openModal(id){document.getElementById(id).classList.add('on');}
function closeModal(id){document.getElementById(id).classList.remove('on');}
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on');}));

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
loadS();
initStart();
</script>
</body>
</html>
